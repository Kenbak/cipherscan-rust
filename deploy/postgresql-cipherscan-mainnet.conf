# PostgreSQL tuning for CipherScan mainnet (64 GB RAM, NVMe storage).
# Deployed at /etc/postgresql/16/main/conf.d/cipherscan.conf on the mainnet
# host. Captured here for disaster recovery — this file was live-only and
# undocumented in version control until 2026-08-15 (a full OS-drive rebuild
# on 2026-07-16 had to be tuned from institutional memory alone).
#
# To apply on a fresh host: copy to
# /etc/postgresql/16/main/conf.d/cipherscan.conf and `systemctl restart
# postgresql`. Values assume PostgreSQL and Zebra state are on separate
# NVMe drives — do not reuse these on a host where they share a disk with
# Zebra. Exact host specs and provider are documented in the internal
# (non-public) ops wiki, not here.

shared_buffers = 16GB
effective_cache_size = 48GB
work_mem = 256MB
maintenance_work_mem = 2GB
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
random_page_cost = 1.1
effective_io_concurrency = 200
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 64MB
default_statistics_target = 100
max_connections = 200
listen_addresses = 'localhost'
