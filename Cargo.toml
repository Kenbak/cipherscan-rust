[package]
name = "cipherscan-indexer"
version = "0.1.0"
edition = "2021"
description = "Fast Rust indexer for CipherScan - reads directly from Zebra's RocksDB"
authors = ["CipherScan"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono"] }
rocksdb = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Zcash parsing (from Zebra)
# NU6.3 / Ironwood: parsing v6 transactions (Ironwood shielded component) requires
# the Ironwood-capable zebra-chain, which is not yet published to crates.io. Point at
# the Ironwood fork branch. NOTE: verify on a build env — the fork may gate the V6 /
# ironwood types behind a feature flag (e.g. `tx_v6`) that must be enabled here, and
# confirm the final canonical repo (ZF may land an official ironwood branch).
# zebra-chain = "9"  # pre-Ironwood (crates.io) — kept for reference
zebra-chain = { git = "https://github.com/valargroup/zebra", branch = "ironwood-main" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"

# Environment
dotenvy = "0.15"

# HTTP client for RPC verification
reqwest = { version = "0.11", features = ["json"] }

# gRPC client for Zebra indexer streaming
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
