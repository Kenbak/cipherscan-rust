name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (required to build the gRPC .proto files)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --release --all-targets -- -D warnings

  build-and-test:
    name: build + test (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherscan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cipherscan_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc and postgresql-client
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Apply schema to the disposable CI database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cipherscan_ci \
            -c "CREATE ROLE zcash_user LOGIN SUPERUSER;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d cipherscan_ci \
            -v ON_ERROR_STOP=1 -f schema/postgres.sql

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test --release
        run: cargo test --release -- --test-threads=4
